name: Core Engine Evidence

on:
  push:
    branches:
      - main
      - "phd/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify runtime contract
        run: node tools/ci/check-runtime.mjs

      - name: Verify claim-gate counterexamples
        run: node --test tools/check-core-claim-boundaries.test.mjs

      - name: Enforce active claim boundaries
        run: node tools/check-core-claim-boundaries.mjs

      - name: Enforce evidence-lane structure
        run: node tools/check-core-evidence-structure.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck core engine
        run: pnpm --filter @omni-dromenon/core-engine typecheck

      - name: Run deterministic core tests
        run: pnpm --filter @omni-dromenon/core-engine test

      - name: Produce consensus benchmark baseline
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          pnpm --filter @omni-dromenon/core-engine test:bench --
          --output "$GITHUB_WORKSPACE/benchmark-results/consensus-baseline.json"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-engine-consensus-baseline-${{ github.sha }}
          path: benchmark-results/consensus-baseline.json
          if-no-files-found: error
          retention-days: 90
