name: PR81 Restore Review Access

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr81-restore-review.yml

permissions:
  pull-requests: write

jobs:
  restore-review-access:
    if: github.event.pull_request.number == 81 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, dependency installation, or candidate-code execution.
      # Only PR81's conversation lock may change; no branch or protection writes.
      - name: Remove stale conversation lock and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/4444J99/metasystem-master'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json'}
          def read_pr():
              request = urllib.request.Request(base+'/pulls/81', headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              assert data['number'] == 81 and data['state'] == 'open'
              assert data['head']['repo']['id'] == 1124366412
              assert data['base']['repo']['id'] == 1124366412
              assert data['head']['sha'] == os.environ['EXPECTED_HEAD']
              return data
          before = read_pr()
          if before['locked']:
              request = urllib.request.Request(base+'/issues/81/lock', headers=headers, method='DELETE')
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 204
          after = read_pr()
          assert after['locked'] is False
          print(json.dumps({'repository_id': 1124366412, 'pr':81,
              'head_sha': after['head']['sha'], 'locked_before':before['locked'],
              'locked_after':after['locked'], 'branch_protections_changed':False,
              'refs_changed':False}, indent=2))
          PY
